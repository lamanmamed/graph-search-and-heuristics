[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-search-and-heuristics"
version = "0.1.0"
description = "Graph search, heuristic optimisation, and constrained generation over a word-adjacency network"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.0",
    "numpy>=1.24",
]

[tool.setuptools.packages.find]
where = ["src"]
